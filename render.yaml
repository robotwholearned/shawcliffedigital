services:
  - type: web
    name: shawcliffe-digital
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TO_EMAIL
        value: cassandra@shawcliffedigital.com
