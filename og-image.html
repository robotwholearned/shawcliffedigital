<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #0f172a;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: #0f172a;
    display: flex;
    align-items: center;
    padding: 80px 100px;
    gap: 80px;
    position: relative;
    overflow: hidden;
  }
  /* Subtle background accent */
  .card::before {
    content: '';
    position: absolute;
    top: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(29,78,216,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    bottom: -150px;
    left: 200px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(29,78,216,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .logo-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
  .logo-name {
    margin-top: 20px;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #ffffff;
    line-height: 1;
  }
  .logo-sub {
    margin-top: 8px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #60a5fa;
  }
  .divider {
    width: 1px;
    height: 220px;
    background: rgba(255,255,255,0.12);
    flex-shrink: 0;
  }
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #60a5fa;
  }
  .headline {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.02em;
    color: #ffffff;
  }
  .headline span { color: #60a5fa; }
  .tagline {
    font-size: 18px;
    line-height: 1.6;
    color: #94a3b8;
    max-width: 480px;
  }
  .badge {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(29,78,216,0.2);
    border: 1px solid rgba(29,78,216,0.4);
    border-radius: 9999px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #93c5fd;
    width: fit-content;
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
<div class="card">
  <div class="logo-col">
    <svg width="100" height="130" viewBox="0 0 129 169" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 67 32 L 24 59 L 24 96 L 60 118 L 66 118 L 66 105 L 38 87 L 38 66 L 65 49 L 93 65 L 108 58 Z" fill="#60a5fa"/>
      <path d="M 62 137 L 105 110 L 105 73 L 69 51 L 63 51 L 63 64 L 91 82 L 91 103 L 64 120 L 36 104 L 21 111 Z" fill="#ffffff"/>
    </svg>
    <div class="logo-name">Shawcliffe</div>
    <div class="logo-sub">Digital</div>
  </div>

  <div class="divider"></div>

  <div class="content">
    <div class="eyebrow">Custom Branded Apps</div>
    <div class="headline">Your business.<br>Your brand.<br><span>In their pocket.</span></div>
    <div class="tagline">App systems for local contractors who want more leads, better follow-up, and stronger reviews.</div>
    <div class="badge">shawcliffedigital.com</div>
  </div>
</div>
</body>
</html>
