<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;900&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #FFFFFF;
  }
  .card {
    width: 1200px;
    height: 630px;
    background: #FFFFFF;
    display: flex;
    align-items: stretch;
  }

  /* Left column — logo panel */
  .logo-col {
    width: 380px;
    flex-shrink: 0;
    background: #F8F9FC;
    border-right: 2px solid #EEF0F6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 64px 48px;
  }
  .logo-name {
    margin-top: 24px;
    font-family: 'Montserrat', sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #040F23;
    line-height: 1;
  }
  .logo-divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .logo-rule {
    height: 1.5px;
    width: 24px;
    background: #114AC4;
    display: inline-block;
  }
  .logo-sub {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #114AC4;
  }
  .logo-tagline {
    margin-top: 28px;
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-align: center;
    color: #040F23;
    line-height: 1.8;
  }
  .logo-tagline span { color: #114AC4; }

  /* Right column — content */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 80px;
    gap: 0;
  }
  .eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #114AC4;
    margin-bottom: 20px;
  }
  .headline {
    font-family: 'Montserrat', sans-serif;
    font-size: 52px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    color: #040F23;
    margin-bottom: 28px;
  }
  .headline span { color: #114AC4; }
  .rule {
    width: 48px;
    height: 3px;
    background: #114AC4;
    margin-bottom: 28px;
  }
  .tagline {
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    font-weight: 400;
    line-height: 1.75;
    color: #3A4060;
    max-width: 440px;
    margin-bottom: 36px;
  }
  .domain {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #114AC4;
  }
</style>
</head>
<body>
<div class="card">

  <div class="logo-col">
    <svg width="80" height="105" viewBox="0 0 129 169" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 67 32 L 24 59 L 24 96 L 60 118 L 66 118 L 66 105 L 38 87 L 38 66 L 65 49 L 93 65 L 108 58 Z" fill="#114AC4"/>
      <path d="M 72 74 L 66 74 L 66 87 L 94 105 L 94 126 L 67 143 L 39 127 L 24 134 L 65 160 L 108 133 L 108 96 Z" fill="#040F23"/>
    </svg>
    <div class="logo-name">SHAWCLIFFE</div>
    <div class="logo-divider">
      <span class="logo-rule"></span>
      <span class="logo-sub">DIGITAL</span>
      <span class="logo-rule"></span>
    </div>
    <div class="logo-tagline">
      CUSTOM BRANDED APPS FOR<br>
      <span>LOCAL CONTRACTORS &amp;<br>OWNER OPERATORS</span>
    </div>
  </div>

  <div class="content">
    <div class="eyebrow">Shawcliffe Digital</div>
    <div class="headline">YOUR BUSINESS.<br>YOUR BRAND.<br><span>IN THEIR POCKET.</span></div>
    <div class="rule"></div>
    <div class="tagline">App systems for local contractors who want more leads, better follow-up, and stronger reviews.</div>
    <div class="domain">shawcliffedigital.com</div>
  </div>

</div>
</body>
</html>
